<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Devocional</title>
    <!-- Tailwind CSS para um design rápido e bonito -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-amber-50 text-gray-800 font-sans h-screen flex flex-col">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="flex flex-col items-center justify-center h-full">
        <div class="bg-white p-8 rounded-lg shadow-lg w-11/12 max-w-sm">
            <h1 class="text-2xl font-bold text-amber-700 mb-6 text-center">Nosso Devocional</h1>
            <input type="text" id="username" placeholder="Seu Nome" class="w-full mb-4 px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-amber-500">
            
            <div class="relative w-full mb-6">
                <input type="password" id="password" placeholder="Senha" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-amber-500">
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-2 text-gray-500 text-sm">Ver</button>
            </div>

            <button onclick="realizarLogin()" id="btn-login" class="w-full bg-amber-600 text-white py-2 rounded hover:bg-amber-700 transition">Entrar</button>
            <p id="login-error" class="text-red-500 text-sm text-center mt-2 hidden"></p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-screen" class="hidden flex-col h-full">
        
        <!-- HEADER -->
        <header class="bg-amber-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-bold">📖 Devocional</h1>
            <div class="flex items-center gap-4">
                <span id="user-display" class="font-medium"></span>
                <button onclick="sair()" class="text-sm bg-amber-800 px-3 py-1 rounded hover:bg-amber-900">Sair</button>
            </div>
        </header>

        <!-- NAVEGAÇÃO DAS ABAS -->
        <nav class="flex bg-amber-200">
            <button onclick="mudarAba('aba-devocional')" id="nav-devocional" class="flex-1 py-3 text-center font-bold border-b-4 border-amber-600">Devocional do Dia</button>
            <button onclick="mudarAba('aba-historico')" id="nav-historico" class="flex-1 py-3 text-center font-bold text-amber-700 border-b-4 border-transparent hover:bg-amber-300">Histórico</button>
        </nav>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 overflow-y-auto p-4 relative">
            
            <!-- ABA DEVOCIONAL -->
            <div id="aba-devocional" class="block pb-20">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="navegarData(-1)" class="bg-gray-200 px-3 py-1 rounded">⬅ Anterior</button>
                    <span id="data-atual" class="font-bold text-amber-700">Carregando...</span>
                    <button onclick="navegarData(1)" id="btn-proximo" class="bg-gray-200 px-3 py-1 rounded">Próximo ➡</button>
                </div>

                <div class="bg-white p-5 rounded-lg shadow-md mb-6">
                    <h2 id="ref-biblica" class="text-xl font-bold text-amber-800 mb-3">...</h2>
                    <div id="texto-biblico" class="text-gray-700 leading-relaxed whitespace-pre-line text-lg italic">
                        Buscando devocional...
                    </div>
                </div>

                <div class="bg-white p-5 rounded-lg shadow-md">
                    <h3 class="font-bold text-gray-700 mb-2">Suas Anotações e Oração:</h3>
                    <textarea id="anotacao-texto" rows="4" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="O que Deus falou com você hoje?"></textarea>
                    <button onclick="salvarAnotacao()" class="w-full mt-3 bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">Salvar e Concluir ✔</button>
                    <p id="msg-salvo" class="text-green-600 text-sm text-center mt-2 hidden">Salvo com sucesso no Histórico!</p>
                </div>
            </div>

            <!-- ABA HISTÓRICO / CALENDÁRIO -->
            <div id="aba-historico" class="hidden">
                <h2 class="text-2xl font-bold text-amber-800 mb-4">Histórico Realizado</h2>
                <button onclick="carregarHistorico()" class="mb-4 bg-amber-100 text-amber-800 px-4 py-2 rounded text-sm w-full font-bold">🔄 Atualizar Histórico</button>
                <div id="lista-historico" class="space-y-4">
                    <!-- Cards do histórico entram aqui via JS -->
                </div>
            </div>

        </main>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // === ATENÇÃO: COLOQUE A URL DO SEU WEB APP AQUI ===
        const API_URL = "https://script.google.com/macros/s/AKfycbyRRq99q9ldKX9XI5irg0LKaFShHEbY39unKOSw__yoHyUGWYaO05VJG7B82ICPiCs/exec"; 
        
        let offsetDias = 0; // 0 = hoje, -1 = ontem
        let dataAlvoAtual = "";

        // Verifica se já está logado ao carregar a página
        window.onload = () => {
            const user = localStorage.getItem("devocional_user");
            if(user) {
                document.getElementById('user-display').innerText = user;
                mostrarApp();
            }
        };

        function togglePassword() {
            const input = document.getElementById('password');
            const btn = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = 'Ocultar';
            } else {
                input.type = 'password';
                btn.innerText = 'Ver';
            }
        }

        async function realizarLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('login-error');
            
            btn.innerText = "Carregando...";
            errorMsg.classList.add('hidden');

            const res = await apiCall({ action: 'login', usuario: user, senha: pass });
            
            if(res.success) {
                localStorage.setItem("devocional_user", res.usuario);
                document.getElementById('user-display').innerText = res.usuario;
                mostrarApp();
            } else {
                errorMsg.innerText = res.message;
                errorMsg.classList.remove('hidden');
            }
            btn.innerText = "Entrar";
        }

        function sair() {
            localStorage.removeItem("devocional_user");
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function mostrarApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('flex');
            carregarDevocional();
        }

        function mudarAba(aba) {
            document.getElementById('aba-devocional').classList.add('hidden');
            document.getElementById('aba-historico').classList.add('hidden');
            document.getElementById(aba).classList.remove('hidden');
            document.getElementById(aba).classList.add('block');

            // Visual das abas
            document.getElementById('nav-devocional').classList.remove('border-amber-600', 'text-amber-700');
            document.getElementById('nav-historico').classList.remove('border-amber-600', 'text-amber-700');
            
            if(aba === 'aba-devocional') {
                document.getElementById('nav-devocional').classList.add('border-amber-600');
            } else {
                document.getElementById('nav-historico').classList.add('border-amber-600');
                carregarHistorico();
            }
        }

        async function carregarDevocional() {
            document.getElementById('ref-biblica').innerText = "Carregando...";
            document.getElementById('texto-biblico').innerText = "Por favor, aguarde o Gemini preparar ou buscar o devocional...";
            document.getElementById('data-atual').innerText = "...";
            document.getElementById('anotacao-texto').value = '';
            document.getElementById('msg-salvo').classList.add('hidden');

            // Esconde botão próximo se estivermos no hoje
            document.getElementById('btn-proximo').style.visibility = offsetDias >= 0 ? 'hidden' : 'visible';

            const res = await apiCall({ action: 'getDevocional', dataOffset: offsetDias });
            
            if(res.success) {
                dataAlvoAtual = res.data;
                document.getElementById('data-atual').innerText = res.data;
                document.getElementById('ref-biblica').innerText = res.referencia;
                document.getElementById('texto-biblico').innerText = res.texto;
            } else {
                document.getElementById('data-atual').innerText = "Data não gerada";
                document.getElementById('ref-biblica').innerText = "Ops!";
                document.getElementById('texto-biblico').innerText = "Não há devocional gerado para esta data passada. Volte para o dia atual.";
            }
        }

        function navegarData(direcao) {
            offsetDias += direcao;
            if(offsetDias > 0) offsetDias = 0; // Não deixa ir pro futuro
            carregarDevocional();
        }

        async function salvarAnotacao() {
            const user = localStorage.getItem("devocional_user");
            const texto = document.getElementById('anotacao-texto').value;
            
            if(!texto) return alert("Escreva algo antes de salvar!");

            const res = await apiCall({ action: 'salvarAnotacao', dataAlvo: dataAlvoAtual, usuario: user, anotacao: texto });
            if(res.success) {
                document.getElementById('msg-salvo').classList.remove('hidden');
                setTimeout(() => document.getElementById('msg-salvo').classList.add('hidden'), 3000);
            }
        }

        async function carregarHistorico() {
            const container = document.getElementById('lista-historico');
            container.innerHTML = "<p class='text-center text-gray-500'>Carregando histórico...</p>";
            
            const res = await apiCall({ action: 'getHistorico' });
            if(res.success) {
                container.innerHTML = "";
                if(res.historico.length === 0) {
                    container.innerHTML = "<p class='text-center'>Nenhuma anotação ainda.</p>";
                    return;
                }
                
                res.historico.forEach(item => {
                    // Verifica se foi feito atrasado (a data do devocional é diferente da data de realização)
                    let avisoAtraso = "";
                    const dataAlvoCurta = item.dataAlvo; // ex 12/09/2026
                    const dataRealCurta = item.dataRealizacao.split(" ")[0]; // Pega so a data
                    if(dataAlvoCurta !== dataRealCurta) {
                        avisoAtraso = `<span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded ml-2">Feito em: ${item.dataRealizacao}</span>`;
                    }

                    const card = `
                        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-amber-500">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-amber-700">📅 Ref: ${item.dataAlvo}</span>
                                <span class="text-sm text-gray-500 font-bold">👤 ${item.usuario}</span>
                            </div>
                            <p class="text-gray-700 italic">"${item.anotacao}"</p>
                            <div class="mt-2 text-right">
                                ${avisoAtraso}
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            }
        }

        // Função utilitária para chamar a API do Google
        async function apiCall(payload) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow'
                });
                return await response.json();
            } catch (error) {
                console.error("Erro na API:", error);
                return { success: false, message: "Erro de conexão" };
            }
        }
    </script>
</body>
</html>
