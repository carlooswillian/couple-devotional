<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Devocional em Casal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <!-- Ícones Modernos (Phosphor) -->
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none; 
        }
        .fonte-biblia { font-family: 'Merriweather', serif; }
        .escondido { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .padding-safe-bottom { padding-bottom: env(safe-area-inset-bottom, 12px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-[100dvh] w-full flex flex-col overflow-hidden m-0 p-0">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="flex flex-col items-center justify-center h-full px-6 bg-gradient-to-br from-teal-50 to-slate-100">
        <div class="bg-white p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] w-full max-w-md text-center border border-slate-100">
            <i class="ph ph-hands-praying text-5xl text-teal-600 mb-4 inline-block"></i>
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Nosso Devocional</h1>
            <p class="text-slate-500 mb-8 text-sm">Crescendo juntos todos os dias</p>
            
            <div class="space-y-4">
                <div class="relative">
                    <i class="ph ph-user absolute left-4 top-3.5 text-slate-400 text-lg"></i>
                    <input type="text" id="username" placeholder="Seu Nome" class="w-full pl-12 pr-4 py-3 bg-slate-50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 border border-slate-200 transition-all">
                </div>
                
                <div class="relative">
                    <i class="ph ph-lock-key absolute left-4 top-3.5 text-slate-400 text-lg"></i>
                    <input type="password" id="password" placeholder="Senha" class="w-full pl-12 pr-12 py-3 bg-slate-50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 border border-slate-200 transition-all">
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-3.5 text-slate-400 hover:text-teal-600">
                        <i id="eye-icon" class="ph ph-eye text-lg"></i>
                    </button>
                </div>
            </div>

            <button onclick="realizarLogin()" id="btn-login" class="w-full bg-teal-600 text-white font-semibold py-3 rounded-2xl mt-8 shadow-lg shadow-teal-200 hover:bg-teal-700 active:scale-95 transition-all">
                Entrar
            </button>
            <p id="login-error" class="text-rose-500 text-sm mt-4 escondido font-medium"></p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-screen" class="escondido flex-col h-full w-full max-w-md mx-auto bg-slate-50 shadow-2xl relative overflow-hidden">
        
        <!-- HEADER -->
        <header class="py-4 px-6 flex justify-between items-center bg-slate-50 shrink-0 border-b border-slate-100 shadow-sm z-10">
            <div>
                <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Bom dia,</p>
                <h1 id="user-display" class="text-xl font-bold text-slate-800 leading-tight">Nome</h1>
            </div>
            <button onclick="sair()" class="h-9 w-9 bg-white rounded-full flex items-center justify-center text-slate-400 hover:text-rose-500 shadow-sm border border-slate-100 transition-all">
                <i class="ph ph-sign-out text-lg"></i>
            </button>
        </header>

        <!-- ÁREA ROLÁVEL PRINCIPAL -->
        <main class="flex-1 overflow-y-auto px-6 py-4 w-full">
            
            <!-- ABA: DEVOCIONAL -->
            <div id="aba-devocional" class="block pb-4">
                <div class="flex justify-between items-center bg-white p-2 rounded-2xl shadow-sm border border-slate-100 mb-5">
                    <button onclick="navegarData(-1)" class="h-10 w-10 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 hover:bg-teal-50 hover:text-teal-600 transition-colors">
                        <i class="ph ph-caret-left font-bold"></i>
                    </button>
                    <span id="data-atual" class="font-semibold text-sm text-slate-700">Carregando...</span>
                    <button onclick="navegarData(1)" id="btn-proximo" class="h-10 w-10 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 hover:bg-teal-50 hover:text-teal-600 transition-colors">
                        <i class="ph ph-caret-right font-bold"></i>
                    </button>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-100 mb-5">
                    <div class="flex items-center gap-2 mb-4">
                        <i class="ph-fill ph-book-open-text text-teal-600 text-xl"></i>
                        <h2 id="ref-biblica" class="text-lg font-bold text-slate-800 tracking-tight">...</h2>
                    </div>
                    <div id="texto-biblico" class="fonte-biblia text-slate-600 leading-relaxed text-lg whitespace-pre-line font-light">
                        Preparando a leitura de hoje...
                    </div>
                </div>

                <div class="bg-white p-5 rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-100 mb-2">
                    <h3 class="font-semibold text-slate-800 mb-3 flex items-center gap-2">
                        <i class="ph-fill ph-pencil-simple text-teal-600"></i> Reflexão
                    </h3>
                    <textarea id="anotacao-texto" rows="3" class="w-full bg-slate-50 rounded-2xl p-4 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition-colors resize-none text-slate-700 placeholder-slate-400 text-sm" placeholder="O que Deus falou com você hoje?"></textarea>
                    
                    <button id="btn-salvar-anotacao" onclick="salvarAnotacao(event)" class="w-full mt-3 bg-slate-800 text-white font-medium py-3 rounded-2xl shadow hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="ph-bold ph-check"></i> Salvar Reflexão
                    </button>
                    
                    <div id="msg-salvo" class="escondido bg-teal-50 text-teal-700 px-4 py-3 rounded-xl text-sm font-medium text-center mt-3 flex items-center justify-center gap-2">
                        <i class="ph-fill ph-check-circle text-lg"></i> Salvo no Histórico!
                    </div>
                </div>
            </div>

            <!-- ABA: HISTÓRICO (CALENDÁRIO) -->
            <div id="aba-historico" class="escondido pb-6">
                <!-- Conteúdo original do histórico mantido... -->
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="ph-fill ph-calendar-check text-teal-600"></i> Calendário
                    </h2>
                    <button onclick="carregarHistorico()" class="text-teal-600 hover:bg-teal-50 p-2 rounded-full transition-colors" title="Atualizar">
                        <i class="ph-bold ph-arrows-clockwise text-xl"></i>
                    </button>
                </div>

                <div class="bg-white p-4 rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-100">
                    <div class="flex justify-between items-center mb-4 px-2">
                        <button onclick="mudarMes(-1)" class="h-8 w-8 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 hover:bg-teal-50 hover:text-teal-600">
                            <i class="ph ph-caret-left font-bold"></i>
                        </button>
                        <span id="mes-ano-label" class="font-bold text-slate-700 text-base">...</span>
                        <button onclick="mudarMes(1)" class="h-8 w-8 flex items-center justify-center rounded-xl bg-slate-50 text-slate-600 hover:bg-teal-50 hover:text-teal-600">
                            <i class="ph ph-caret-right font-bold"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
                        <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
                    </div>

                    <div id="calendario-grid" class="grid grid-cols-7 gap-1"></div>
                </div>

                <div class="flex justify-center items-center gap-6 mt-4 text-xs text-slate-500 font-medium bg-white py-3 px-4 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-2">
                        <div id="legenda-avatar-1" class="w-6 h-6 rounded-full bg-teal-600 text-white flex items-center justify-center text-[10px] font-bold">U</div>
                        <span id="legenda-nome-1">Você</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div id="legenda-avatar-2" class="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] font-bold">T</div>
                        <span id="legenda-nome-2">Parceiro(a)</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="shrink-0 bg-white border-t border-slate-200 shadow-[0_-5px_15px_rgb(0,0,0,0.03)] pt-2 padding-safe-bottom w-full">
            <div class="flex justify-around items-center">
                <button onclick="mudarAba('aba-devocional')" id="nav-devocional" class="flex flex-col items-center p-2 w-20 text-teal-600 font-semibold transition-colors">
                    <i id="icon-devocional" class="ph-fill ph-house text-2xl mb-1"></i>
                    <span class="text-[11px]">Hoje</span>
                </button>
                <button onclick="mudarAba('aba-historico')" id="nav-historico" class="flex flex-col items-center p-2 w-20 text-slate-400 font-medium hover:text-teal-600 transition-colors">
                    <i id="icon-historico" class="ph ph-calendar-check text-2xl mb-1"></i>
                    <span class="text-[11px]">Histórico</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- MODAL DE DETALHES -->
    <div id="modal-dia" class="escondido fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <!-- Estrutura do Modal Mantida -->
        <div class="bg-white w-full max-w-md max-h-[85vh] rounded-t-[2.5rem] sm:rounded-3xl p-6 shadow-2xl flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 shrink-0">
                <div>
                    <span id="modal-data" class="text-xs font-semibold text-teal-600 uppercase tracking-wider">Data</span>
                    <h3 id="modal-referencia" class="text-lg font-bold text-slate-800">Referência</h3>
                </div>
                <button onclick="fecharModal()" class="h-8 w-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200">
                    <i class="ph ph-x font-bold"></i>
                </button>
            </div>
            <div class="overflow-y-auto flex-1 space-y-4 pr-1">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-xs font-semibold text-slate-400 uppercase mb-1">Leitura Bíblica</p>
                    <div id="modal-texto-biblico" class="fonte-biblia text-slate-700 text-sm leading-relaxed whitespace-pre-line font-light"></div>
                </div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase mb-2">Reflexões do Casal</p>
                    <div id="modal-comentarios" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // ATENÇÃO: COLOQUE AQUI A SUA URL DA API DE NOVO
        const API_URL = "https://script.google.com/macros/s/AKfycbyRRq99q9ldKX9XI5irg0LKaFShHEbY39unKOSw__yoHyUGWYaO05VJG7B82ICPiCs/exec"; 
        
        let offsetDias = 0;
        let dataAlvoAtual = "";
        let cacheHistoricoData = { historico: [], devocionais: {} };
        let dataCalendarioAtual = new Date();

        window.onload = () => {
            const user = localStorage.getItem("devocional_user");
            if(user) {
                document.getElementById('user-display').innerText = user;
                mostrarApp();
            }
        };

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        async function realizarLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('login-error');
            
            if(!user || !pass) return;

            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i>';
            errorMsg.classList.add('escondido');

            const res = await apiCall({ action: 'login', usuario: user, senha: pass });
            
            if(res.success) {
                localStorage.setItem("devocional_user", res.usuario);
                document.getElementById('user-display').innerText = res.usuario;
                mostrarApp();
            } else {
                errorMsg.innerText = res.message;
                errorMsg.classList.remove('escondido');
            }
            btn.innerHTML = 'Entrar';
        }

        function sair() {
            localStorage.removeItem("devocional_user");
            document.getElementById('app-screen').classList.add('escondido');
            document.getElementById('login-screen').classList.remove('escondido');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            offsetDias = 0;
        }

        function mostrarApp() {
            document.getElementById('login-screen').classList.add('escondido');
            document.getElementById('app-screen').classList.remove('escondido');
            document.getElementById('app-screen').classList.add('flex');
            carregarDevocional();
        }

        function mudarAba(aba) {
            document.getElementById('aba-devocional').classList.add('escondido');
            document.getElementById('aba-historico').classList.add('escondido');
            
            document.getElementById(aba).classList.remove('escondido');
            document.getElementById(aba).classList.add('block');

            const navDev = document.getElementById('nav-devocional');
            const navHist = document.getElementById('nav-historico');
            const iconDev = document.getElementById('icon-devocional');
            const iconHist = document.getElementById('icon-historico');

            navDev.className = "flex flex-col items-center p-2 w-20 text-slate-400 font-medium transition-colors";
            iconDev.className = "ph ph-house text-2xl mb-1";
            navHist.className = "flex flex-col items-center p-2 w-20 text-slate-400 font-medium transition-colors";
            iconHist.className = "ph ph-calendar-check text-2xl mb-1";
            
            if(aba === 'aba-devocional') {
                navDev.className = "flex flex-col items-center p-2 w-20 text-teal-600 font-semibold transition-colors";
                iconDev.className = "ph-fill ph-house text-2xl mb-1";
            } else {
                navHist.className = "flex flex-col items-center p-2 w-20 text-teal-600 font-semibold transition-colors";
                iconHist.className = "ph-fill ph-calendar-check text-2xl mb-1";
                carregarHistorico();
            }
        }

        async function carregarDevocional() {
            const user = localStorage.getItem("devocional_user"); 
            const cacheKey = `cache_devocional_${offsetDias}`;
            const cacheLocal = localStorage.getItem(cacheKey);
            const btnSalvar = document.getElementById('btn-salvar-anotacao');
            
            if (cacheLocal) {
                const dados = JSON.parse(cacheLocal);
                document.getElementById('data-atual').innerText = dados.data;
                document.getElementById('ref-biblica').innerText = dados.referencia;
                document.getElementById('texto-biblico').innerText = dados.texto; // Usamos innerText para o texto normal
                
                if (dados.anotacao) {
                    document.getElementById('anotacao-texto').value = dados.anotacao;
                    btnSalvar.innerHTML = '<i class="ph-bold ph-pencil-simple"></i> Atualizar Reflexão';
                } else {
                    document.getElementById('anotacao-texto').value = '';
                    btnSalvar.innerHTML = '<i class="ph-bold ph-check"></i> Salvar Reflexão';
                }
            } else {
                document.getElementById('ref-biblica').innerHTML = '<div class="h-4 bg-slate-200 rounded w-24 animate-pulse"></div>';
                document.getElementById('texto-biblico').innerHTML = '<div class="space-y-2"><div class="h-4 bg-slate-200 rounded w-full animate-pulse"></div><div class="h-4 bg-slate-200 rounded w-5/6 animate-pulse"></div></div>';
                document.getElementById('data-atual').innerText = "...";
                document.getElementById('anotacao-texto').value = '';
                btnSalvar.innerHTML = '<i class="ph-bold ph-check"></i> Salvar Reflexão';
            }

            document.getElementById('msg-salvo').classList.add('escondido');
            document.getElementById('btn-proximo').style.opacity = offsetDias >= 0 ? '0.3' : '1';
            document.getElementById('btn-proximo').style.pointerEvents = offsetDias >= 0 ? 'none' : 'auto';

            const res = await apiCall({ action: 'getDevocional', dataOffset: offsetDias, usuario: user });
            
            if(res.success) {
                dataAlvoAtual = res.data;
                localStorage.setItem(cacheKey, JSON.stringify(res));

                document.getElementById('data-atual').innerText = res.data;
                document.getElementById('ref-biblica').innerText = res.referencia;
                document.getElementById('texto-biblico').innerText = res.texto; // Reseta innerText normal
                
                if (res.anotacao) {
                    document.getElementById('anotacao-texto').value = res.anotacao;
                    btnSalvar.innerHTML = '<i class="ph-bold ph-pencil-simple"></i> Atualizar Reflexão';
                }
            } else {
                if (!cacheLocal) {
                    document.getElementById('data-atual').innerText = "Data sem registro";
                    document.getElementById('ref-biblica').innerText = "Nenhum texto";
                    
                    let errorMsg = res.error || res.message || "Não há devocional gerado para este dia.";
                    
                    // Substitui o texto pelo HTML com o Botão
                    document.getElementById('texto-biblico').innerHTML = `
                        <div class="flex flex-col items-center justify-center py-4 text-center">
                            <i class="ph-fill ph-warning-circle text-4xl text-amber-500 mb-3"></i>
                            <p class="text-slate-600 mb-6 text-sm font-medium leading-relaxed">${errorMsg}</p>
                            <button onclick="gerarDevocionalManualmente()" id="btn-gerar-manual" class="bg-teal-600 text-white px-5 py-3 rounded-2xl text-sm font-semibold hover:bg-teal-700 active:scale-95 transition-all shadow-md shadow-teal-200 flex items-center justify-center gap-2 w-full font-sans">
                                <i class="ph-bold ph-magic-wand text-lg"></i> Gerar Devocional Agora
                            </button>
                        </div>
                    `;
                }
            }
        }

                // --- NOVA FUNÇÃO DE GERAÇÃO MANUAL VIA BOTÃO ---
        async function gerarDevocionalManualmente() {
            const user = localStorage.getItem("devocional_user");
            const btn = document.getElementById('btn-gerar-manual');
            
            if (btn) {
                btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Gerando... (Pode demorar uns 10s)';
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-not-allowed');
            }

            // Envia a ação que ignora o bloqueio de dias passados
            const res = await apiCall({ action: 'forcarGeracao', dataOffset: offsetDias, usuario: user });
            
            if (res.success) {
                dataAlvoAtual = res.data;
                const cacheKey = `cache_devocional_${offsetDias}`;
                localStorage.setItem(cacheKey, JSON.stringify(res));

                document.getElementById('data-atual').innerText = res.data;
                document.getElementById('ref-biblica').innerText = res.referencia;
                document.getElementById('texto-biblico').innerText = res.texto; 
                
                document.getElementById('anotacao-texto').value = '';
                const btnSalvar = document.getElementById('btn-salvar-anotacao');
                btnSalvar.innerHTML = '<i class="ph-bold ph-check"></i> Salvar Reflexão';
            } else {
                let errorMsg = res.error || res.message || "Erro desconhecido ao gerar o devocional.";
                
                // NOVO: Renderiza os detalhes técnicos se existirem
                let detalhesTech = res.detalhes ? `<div class="mt-4 p-3 bg-white/50 border border-rose-200 rounded-lg text-left text-[10px] text-rose-800 font-mono overflow-auto max-h-32 break-all shadow-inner"><strong>Detalhes:</strong><br>${res.detalhes}</div>` : '';
                
                // Exibe a tela de erro e deixa o usuário tentar novamente
                document.getElementById('texto-biblico').innerHTML = `
                    <div class="flex flex-col items-center justify-center py-4 text-center p-4 bg-rose-50 rounded-2xl border border-rose-100">
                        <i class="ph-fill ph-warning-circle text-4xl text-rose-500 mb-2"></i>
                        <h3 class="text-rose-800 font-bold mb-1 text-sm">Falha na Geração</h3>
                        <p class="text-rose-600 mb-2 text-xs font-medium leading-relaxed">${errorMsg}</p>
                        ${detalhesTech}
                        <button onclick="gerarDevocionalManualmente()" id="btn-gerar-manual" class="mt-4 bg-teal-600 text-white px-5 py-3 rounded-xl text-sm font-semibold hover:bg-teal-700 active:scale-95 transition-all shadow-md flex items-center justify-center gap-2 w-full font-sans">
                            <i class="ph-bold ph-arrows-clockwise text-lg"></i> Tentar Novamente
                        </button>
                    </div>
                `;
            }
        }


        function navegarData(direcao) {
            offsetDias += direcao;
            if(offsetDias > 0) offsetDias = 0; 
            carregarDevocional();
        }

        async function salvarAnotacao(event) {
            const user = localStorage.getItem("devocional_user");
            const texto = document.getElementById('anotacao-texto').value;
            
            if(!texto) {
                document.getElementById('anotacao-texto').focus();
                return;
            }

            const btn = event.currentTarget;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Salvando...';
            btn.disabled = true;

            const res = await apiCall({ action: 'salvarAnotacao', dataAlvo: dataAlvoAtual, usuario: user, anotacao: texto });
            
            btn.innerHTML = '<i class="ph-bold ph-pencil-simple"></i> Atualizar Reflexão';
            btn.disabled = false;
            
            if(res.success) {
                const msg = document.getElementById('msg-salvo');
                msg.innerHTML = `<i class="ph-fill ph-check-circle text-lg"></i> ${res.message}`;
                msg.classList.remove('escondido');
                setTimeout(() => msg.classList.add('escondido'), 4000);
            }
        }

        async function carregarHistorico() {
            const grid = document.getElementById('calendario-grid');
            grid.innerHTML = `
                <div class="col-span-7 flex flex-col items-center justify-center py-12 text-slate-400">
                    <i class="ph ph-spinner animate-spin text-3xl mb-2"></i>
                    <p class="text-xs">Carregando calendário...</p>
                </div>`;
            
            const res = await apiCall({ action: 'getHistorico' });
            
            if(res.success) {
                cacheHistoricoData = res;
                atualizarLegendaUsuarios(res.historico);
                montarCalendario();
            }
        }

        function atualizarLegendaUsuarios(historico) {
            const currentUser = localStorage.getItem("devocional_user");
            let outrosUsuarios = [...new Set(historico.map(h => h.usuario))].filter(u => u.toLowerCase() !== currentUser.toLowerCase());
            let secondUser = outrosUsuarios.length > 0 ? outrosUsuarios[0] : "Parceiro(a)";

            document.getElementById('legenda-nome-1').innerText = currentUser;
            document.getElementById('legenda-avatar-1').innerText = currentUser.charAt(0).toUpperCase();
            
            document.getElementById('legenda-nome-2').innerText = secondUser;
            document.getElementById('legenda-avatar-2').innerText = secondUser.charAt(0).toUpperCase();
        }

        function mudarMes(direcao) {
            dataCalendarioAtual.setMonth(dataCalendarioAtual.getMonth() + direcao);
            montarCalendario();
        }

        function montarCalendario() {
            const grid = document.getElementById('calendario-grid');
            grid.innerHTML = "";

            const ano = dataCalendarioAtual.getFullYear();
            const mes = dataCalendarioAtual.getMonth();

            const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            document.getElementById('mes-ano-label').innerText = `${nomesMeses[mes]} de ${ano}`;

            const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
            const ultimoDiaMes = new Date(ano, mes + 1, 0).getDate();
            const currentUser = localStorage.getItem("devocional_user");

            let mapaHistorico = {};
            cacheHistoricoData.historico.forEach(item => {
                if(!mapaHistorico[item.dataAlvo]) mapaHistorico[item.dataAlvo] = [];
                mapaHistorico[item.dataAlvo].push(item);
            });

            for(let i = 0; i < primeiroDiaSemana; i++) {
                grid.innerHTML += `<div></div>`;
            }

            for(let dia = 1; dia <= ultimoDiaMes; dia++) {
                let diaStr = String(dia).padStart(2, '0');
                let mesStr = String(mes + 1).padStart(2, '0');
                let dataChave = `${diaStr}/${mesStr}/${ano}`;

                let registrosDoDia = mapaHistorico[dataChave] || [];
                let avataresHTML = "";
                let usuariosNoDia = [...new Set(registrosDoDia.map(r => r.usuario))];

                usuariosNoDia.forEach(user => {
                    let isMe = user.toLowerCase() === currentUser.toLowerCase();
                    let corBg = isMe ? "bg-teal-600 text-white" : "bg-indigo-600 text-white";
                    let inicial = user.charAt(0).toUpperCase();
                    avataresHTML += `<div class="w-5 h-5 rounded-full ${corBg} text-[10px] font-bold flex items-center justify-center shadow-sm" title="${user}">${inicial}</div>`;
                });

                let hoje = new Date();
                let isHoje = dia === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear();
                let estiloHoje = isHoje ? "border-teal-500 font-bold bg-teal-50/50" : "border-slate-100 hover:bg-slate-50";

                grid.innerHTML += `
                    <div onclick="abrirDetalhesDia('${dataChave}')" class="h-16 rounded-2xl border ${estiloHoje} bg-white p-1 flex flex-col justify-between items-center cursor-pointer transition-all shadow-[0_2px_8px_rgb(0,0,0,0.01)] relative">
                        <span class="text-xs text-slate-700 ${isHoje ? 'text-teal-600 font-bold' : ''}">${dia}</span>
                        <div class="flex gap-0.5 flex-wrap justify-center items-center mb-1">
                            ${avataresHTML}
                        </div>
                    </div>
                `;
            }
        }

        function abrirDetalhesDia(dataChave) {
            document.getElementById('modal-data').innerText = dataChave;
            
            let devData = cacheHistoricoData.devocionais[dataChave];
            if(devData) {
                document.getElementById('modal-referencia').innerText = devData.referencia;
                document.getElementById('modal-texto-biblico').innerText = devData.texto;
            } else {
                document.getElementById('modal-referencia').innerText = "Sem registro de leitura";
                document.getElementById('modal-texto-biblico').innerText = "Nenhum texto bíblico catalogado para esta data.";
            }

            let containerComentarios = document.getElementById('modal-comentarios');
            containerComentarios.innerHTML = "";

            let registrosDia = cacheHistoricoData.historico.filter(h => h.dataAlvo === dataChave);

            if(registrosDia.length === 0) {
                containerComentarios.innerHTML = `
                    <div class="text-center py-6 bg-slate-50 rounded-2xl border border-slate-100">
                        <p class="text-xs text-slate-400">Nenhuma reflexão salva neste dia.</p>
                    </div>`;
            } else {
                const currentUser = localStorage.getItem("devocional_user");
                registrosDia.forEach(item => {
                    let isMe = item.usuario.toLowerCase() === currentUser.toLowerCase();
                    let corAvatar = isMe ? "bg-teal-100 text-teal-700" : "bg-indigo-100 text-indigo-700";
                    
                    containerComentarios.innerHTML += `
                        <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="w-6 h-6 rounded-full ${corAvatar} flex items-center justify-center font-bold text-xs uppercase">
                                    ${item.usuario.charAt(0)}
                                </div>
                                <span class="font-bold text-xs text-slate-800">${item.usuario}</span>
                            </div>
                            <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-line">${item.anotacao}</p>
                        </div>
                    `;
                });
            }

            document.getElementById('modal-dia').classList.remove('escondido');
            document.getElementById('modal-dia').classList.add('flex');
        }

        function fecharModal() {
            document.getElementById('modal-dia').classList.add('escondido');
            document.getElementById('modal-dia').classList.remove('flex');
        }

        async function apiCall(payload) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow'
                });
                return await response.json();
            } catch (error) {
                console.error("Erro:", error);
                return { success: false, message: "Erro de conexão. Verifique sua internet." };
            }
        }
    </script>
</body>
</html>
